<div class="p-6 bg-gray-50 min-h-screen">

  <!-- ── Header ─────────────────────────────────────────────── -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-3xl font-bold text-slate-900">Negocios</h1>
      <p class="text-gray-500 mt-1 text-sm">Gestiona todos los negocios registrados en el sistema</p>
    </div>
    <button (click)="openCreate()"
      class="inline-flex items-center gap-2 px-5 py-2.5 bg-teal-500 hover:bg-teal-600 text-white text-sm font-semibold rounded-xl shadow-sm hover:shadow-md transition-all duration-200">
      <i class="fas fa-plus"></i>
      Nuevo Negocio
    </button>
  </div>

  <!-- Tabla Reutilizable -->
  <app-table [data]="negocios" [columns]="tableColumns" [actions]="tableActions"
    [searchFields]="['name', 'domainCode']" searchPlaceholder="Buscar por nombre o dominio..."
    [itemsPerPage]="10" (actionClick)="onTableAction($event)"
    (selectionChange)="handleSelectionChange($event)">

    <div bulk-actions class="flex space-x-2">
      <button (click)="deleteSelectedNegocios()"
        class="px-3 py-1 bg-red-500 text-white text-sm rounded hover:bg-red-600 transition-colors">
        Eliminar seleccionados
      </button>
    </div>
  </app-table>

</div>

<!-- ══════════════════════════════════════════════════════════════ -->
<!--  MODAL: CREAR NEGOCIO                                      -->
<!-- ══════════════════════════════════════════════════════════════ -->
<div *ngIf="showCreateModal"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm px-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-fade-in">

    <!-- Header modal -->
    <div class="flex items-center justify-between px-6 py-5 border-b border-gray-100">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-teal-100 rounded-xl flex items-center justify-center">
          <i class="fas fa-briefcase text-teal-600 text-sm"></i>
        </div>
        <h2 class="text-lg font-semibold text-slate-900">Nuevo Negocio</h2>
      </div>
      <button (click)="closeCreate()" class="text-gray-400 hover:text-gray-600 transition-colors">
        <i class="fas fa-times text-lg"></i>
      </button>
    </div>

    <!-- Body modal -->
    <div class="px-6 py-5 space-y-4">

      <!-- Nombre -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">
          Nombre <span class="text-red-500">*</span>
        </label>
        <input type="text" [(ngModel)]="newNegocio.name" placeholder="Ej. Mi Negocio S.A."
          class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all">
      </div>

      <!-- Domain ID con SearchSelect -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">
          Dominio <span class="text-red-500">*</span>
        </label>
        <app-search-select
            endpoint="Domain"
            searchParam="search"
            resultPath="data.domains"
            displayField="code"
            valueField="code"
            subtextField="principalName"
            placeholder="Buscar por código de dominio..."
            [(ngModel)]="newNegocio.domainId">
        </app-search-select>
      </div>

      <!-- Avatar URL -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">URL del Avatar</label>
        <input type="text" [(ngModel)]="newNegocio.avatar" placeholder="https://ejemplo.com/logo.png"
          class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all">
      </div>

    </div>

    <!-- Footer modal -->
    <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-100 bg-gray-50">
      <button (click)="closeCreate()"
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 transition-all">
        Cancelar
      </button>
      <button (click)="createNegocio()" [disabled]="!newNegocio.name.trim() || !newNegocio.domainId || isCreating"
        class="inline-flex items-center gap-2 px-5 py-2 text-sm font-semibold text-white bg-teal-500 hover:bg-teal-600 rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
        <i *ngIf="isCreating" class="fas fa-circle-notch fa-spin"></i>
        <i *ngIf="!isCreating" class="fas fa-plus"></i>
        <span>{{ isCreating ? 'Creando...' : 'Crear' }}</span>
      </button>
    </div>

  </div>
</div>

<!-- ══════════════════════════════════════════════════════════════ -->
<!--  MODAL: EDITAR NEGOCIO                                     -->
<!-- ══════════════════════════════════════════════════════════════ -->

  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm px-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-fade-in">

    <!-- Header modal -->
    <div class="flex items-center justify-between px-6 py-5 border-b border-gray-100">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-blue-100 rounded-xl flex items-center justify-center">
          <i class="fas fa-pen text-blue-600 text-sm"></i>
        </div>
        <h2 class="text-lg font-semibold text-slate-900">Editar Negocio</h2>
      </div>
      <button (click)="closeEdit()" class="text-gray-400 hover:text-gray-600 transition-colors">
        <i class="fas fa-times text-lg"></i>
      </button>
    </div>

    <!-- Body modal -->
    <div class="px-6 py-5 space-y-4">

      <!-- Nombre -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">
          Nombre <span class="text-red-500">*</span>
        </label>
        <input type="text" [(ngModel)]="editNegocio.name" placeholder="Ej. Mi Negocio S.A."
          class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all">
      </div>

      <!-- Domain ID con SearchSelect -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">
          Dominio <span class="text-red-500">*</span>
        </label>
        <app-search-select
            endpoint="Domain"
            searchParam="search"
            resultPath="data.domains"
            displayField="code"
            valueField="code"
            subtextField="principalName"
            placeholder="Buscar por código de dominio..."
            [(ngModel)]="editNegocio.domainId">
        </app-search-select>
      </div>

      <!-- Avatar URL -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">URL del Avatar</label>
        <input type="text" [(ngModel)]="editNegocio.avatar" placeholder="https://ejemplo.com/logo.png"
          class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all">
      </div>

    </div>

    <!-- Footer modal -->
    <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-100 bg-gray-50">
      <button (click)="closeEdit()"
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 transition-all">
        Cancelar
      </button>
      <button (click)="updateNegocio()" [disabled]="!editNegocio.name.trim() || !editNegocio.domainId || isUpdating"
        class="inline-flex items-center gap-2 px-5 py-2 text-sm font-semibold text-white bg-blue-500 hover:bg-blue-600 rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
        <i *ngIf="isUpdating" class="fas fa-circle-notch fa-spin"></i>
        <i *ngIf="!isUpdating" class="fas fa-save"></i>
        <span>{{ isUpdating ? 'Guardando...' : 'Guardar cambios' }}</span>
      </button>
    </div>

  </div>
</div>
