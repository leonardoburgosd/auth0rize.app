<div class="flex flex-col h-full bg-gray-900 text-white overflow-hidden">

  <!-- Top Bar -->
  <div class="flex items-center justify-between px-5 py-3 bg-gray-800 border-b border-gray-700 flex-shrink-0">
    <div class="flex items-center gap-3">
      <button (click)="goBack()"
        class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-white hover:bg-gray-700 rounded-lg transition-all">
        <i class="fas fa-arrow-left text-sm"></i>
      </button>
      <div class="w-px h-5 bg-gray-600"></div>
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 bg-purple-600 rounded-lg flex items-center justify-center">
          <i class="fas fa-paint-brush text-xs text-white"></i>
        </div>
        <div>
          <p class="text-xs text-gray-400 leading-none">Editor de Dominio</p>
          <p class="text-sm font-semibold text-white font-mono leading-tight">{{ domainCode }}</p>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button (click)="updatePreview()"
        class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold bg-teal-600 hover:bg-teal-500 text-white rounded-lg transition-all">
        <i class="fas fa-play"></i>
        Ejecutar
      </button>
    </div>
  </div>

  <!-- Main Layout: Editor | Preview -->
  <div class="flex flex-1 overflow-hidden">

    <!-- Editor Panel -->
    <div class="flex flex-col w-1/2 border-r border-gray-700">

      <!-- Tabs -->
      <div class="flex items-center bg-gray-800 border-b border-gray-700 flex-shrink-0">
        <button (click)="setTab('html')"
          class="px-5 py-2.5 text-xs font-semibold transition-all border-b-2"
          [ngClass]="activeTab === 'html'
            ? 'text-orange-400 border-orange-400 bg-gray-900'
            : 'text-gray-400 border-transparent hover:text-gray-200'">
          <i class="fab fa-html5 mr-1.5"></i>HTML
        </button>
        <button (click)="setTab('css')"
          class="px-5 py-2.5 text-xs font-semibold transition-all border-b-2"
          [ngClass]="activeTab === 'css'
            ? 'text-blue-400 border-blue-400 bg-gray-900'
            : 'text-gray-400 border-transparent hover:text-gray-200'">
          <i class="fab fa-css3-alt mr-1.5"></i>CSS
        </button>
      </div>

      <!-- CodeMirror containers -->
      <div class="flex-1 overflow-hidden relative">
        <div #htmlEditorEl
          [style.display]="activeTab === 'html' ? 'block' : 'none'"
          class="h-full w-full absolute inset-0 overflow-auto">
        </div>
        <div #cssEditorEl
          [style.display]="activeTab === 'css' ? 'block' : 'none'"
          class="h-full w-full absolute inset-0 overflow-auto">
        </div>
      </div>

    </div>

    <!-- Preview Panel -->
    <div class="flex flex-col w-1/2">
      <div class="flex items-center gap-2 px-4 py-2.5 bg-gray-800 border-b border-gray-700 flex-shrink-0">
        <div class="flex gap-1.5">
          <div class="w-3 h-3 rounded-full bg-red-500"></div>
          <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
          <div class="w-3 h-3 rounded-full bg-green-500"></div>
        </div>
        <span class="text-xs text-gray-400 ml-1">Vista previa</span>
      </div>
      <iframe #previewFrame class="flex-1 w-full bg-white border-0"></iframe>
    </div>

  </div>

</div>
