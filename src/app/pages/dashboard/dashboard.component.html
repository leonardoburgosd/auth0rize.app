<div class="flex h-screen bg-gray-100">
  <div
    [class]="'bg-slate-900 text-white transition-all duration-300 ease-in-out flex flex-col ' + (sidebarOpen ? 'w-64' : 'w-16')">
    <div class="p-4 border-b border-slate-700">
      <div class="flex items-center justify-between">
        <div *ngIf="sidebarOpen" class="flex items-center">
          <img src="../../../assets/icon.png" alt="Instagram" class="w-8 h-8 mr-2">
          <h2 class="text-l font-bold text-teal-400">[Auth0rize]</h2>
        </div>
        <button (click)="toggleSidebar()" class="p-2 rounded-lg hover:bg-slate-800 transition-colors">
          <i [class]="sidebarOpen ? 'fas fa-times' : 'fas fa-bars'"></i>
        </button>
      </div>
    </div>
    <app-nav-left [sidebarOpen]="sidebarOpen"></app-nav-left>

  </div>
  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="bg-white shadow-sm border-b border-gray-200 p-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-4">
          <h1 class="text-2xl font-bold text-slate-900"></h1>
        </div>

        <div class="flex items-center space-x-4">
          <!-- Search Bar -->
          <div class="relative">
            <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-4 h-4"></i>
            <input type="text" placeholder="Buscar..." (input)="onSearch($event)"
              class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent" />
          </div>

          <!-- Notifications -->
          <div class="relative">
            <button id="notification-btn" (click)="onNotificationClick()"
              class="relative p-2 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors">
              <i class="fas fa-bell w-5 h-5"></i>
              <span *ngIf="unreadCount > 0"
                class="absolute -top-1 -right-1 min-w-[18px] h-[18px] bg-red-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center px-1">
                {{ unreadCount > 9 ? '9+' : unreadCount }}
              </span>
            </button>

            <!-- Panel de notificaciones -->
            <div id="notification-panel" *ngIf="notificationsOpen"
              class="absolute right-0 top-full mt-2 w-80 bg-white rounded-xl shadow-xl border border-gray-200 z-50 overflow-hidden">

              <!-- Header del panel -->
              <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100 bg-gray-50">
                <div class="flex items-center space-x-2">
                  <span class="text-sm font-semibold text-slate-900">Notificaciones</span>
                  <span *ngIf="unreadCount > 0"
                    class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-teal-100 text-teal-700">
                    {{ unreadCount }} nuevas
                  </span>
                </div>
                <button *ngIf="unreadCount > 0" (click)="markAllAsRead()"
                  class="text-xs text-teal-600 hover:text-teal-800 font-medium transition-colors">
                  Marcar todas
                </button>
              </div>

              <!-- Lista scrolleable -->
              <ul class="divide-y divide-gray-100 max-h-80 overflow-y-auto">
                <li *ngFor="let notif of notifications" (click)="markAsRead(notif.id)" [class]="'flex items-start px-4 py-3 cursor-pointer transition-colors ' +
                    (notif.read ? 'hover:bg-gray-50' : 'bg-teal-50 hover:bg-teal-100')">

                  <!-- Ícono -->
                  <div
                    [class]="'flex-shrink-0 w-9 h-9 rounded-full flex items-center justify-center mr-3 ' + notif.iconBg">
                    <i [class]="notif.icon + ' text-sm ' + notif.iconColor"></i>
                  </div>

                  <!-- Contenido -->
                  <div class="flex-1 min-w-0">
                    <div class="flex items-start justify-between">
                      <p
                        [class]="'text-sm truncate pr-2 ' + (notif.read ? 'font-normal text-gray-700' : 'font-semibold text-slate-900')">
                        {{ notif.title }}
                      </p>
                      <span *ngIf="!notif.read" class="flex-shrink-0 w-2 h-2 bg-teal-500 rounded-full mt-1.5"></span>
                    </div>
                    <p class="text-xs text-gray-500 mt-0.5 line-clamp-2">{{ notif.message }}</p>
                    <p class="text-xs text-gray-400 mt-1">{{ notif.time }}</p>
                  </div>
                </li>

                <!-- Estado vacío -->
                <li *ngIf="notifications.length === 0" class="px-4 py-8 text-center">
                  <i class="fas fa-bell-slash text-2xl text-gray-300 mb-2 block"></i>
                  <p class="text-sm text-gray-400">No tienes notificaciones</p>
                </li>
              </ul>

              <!-- Footer -->
              <div class="px-4 py-2.5 border-t border-gray-100 bg-gray-50 text-center">
                <button class="text-xs text-teal-600 hover:text-teal-800 font-medium transition-colors">
                  Ver todas las notificaciones
                </button>
              </div>

            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto p-6 bg-gray-50">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
