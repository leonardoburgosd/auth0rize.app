<div class="p-6 bg-gray-50 min-h-screen">

  <!-- ── Header ─────────────────────────────────────────────── -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-3xl font-bold text-slate-900">Aplicaciones</h1>
      <p class="text-gray-500 mt-1 text-sm">Gestiona todas las aplicaciones registradas en el sistema</p>
    </div>
    <button (click)="openCreate()"
      class="inline-flex items-center gap-2 px-5 py-2.5 bg-teal-500 hover:bg-teal-600 text-white text-sm font-semibold rounded-xl shadow-sm hover:shadow-md transition-all duration-200">
      <i class="fas fa-plus"></i>
      Nueva Aplicación
    </button>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex items-center justify-center py-20 bg-white rounded-2xl shadow-sm border border-gray-200">
    <div class="flex flex-col items-center gap-3 text-gray-400">
      <i class="fas fa-circle-notch fa-spin text-3xl text-teal-500"></i>
      <span class="text-sm">Cargando aplicaciones...</span>
    </div>
  </div>

  <!-- Tabla Reutilizable -->
  <app-table *ngIf="!isLoading" [data]="applications" [columns]="tableColumns" [actions]="tableActions"
    [searchFields]="['name', 'description', 'code']" searchPlaceholder="Buscar por nombre, descripción o código..."
    [itemsPerPage]="10" (actionClick)="onTableAction($event)">
  </app-table>

</div>

<!-- ══════════════════════════════════════════════════════════════ -->
<!--  MODAL: CREAR APLICACIÓN                                      -->
<!-- ══════════════════════════════════════════════════════════════ -->
<div *ngIf="showCreateModal"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm px-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-fade-in">

    <!-- Header modal -->
    <div class="flex items-center justify-between px-6 py-5 border-b border-gray-100">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-teal-100 rounded-xl flex items-center justify-center">
          <i class="fas fa-cube text-teal-600 text-sm"></i>
        </div>
        <h2 class="text-lg font-semibold text-slate-900">Nueva Aplicación</h2>
      </div>
      <button (click)="closeCreate()" class="text-gray-400 hover:text-gray-600 transition-colors">
        <i class="fas fa-times text-lg"></i>
      </button>
    </div>

    <!-- Body modal -->
    <div class="px-6 py-5 space-y-4">

      <!-- Nombre -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">
          Nombre <span class="text-red-500">*</span>
        </label>
        <input type="text" [(ngModel)]="newApp.name" placeholder="Ej. Sistema de RR.HH."
          class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all">
      </div>

      <!-- Descripción -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Descripción</label>
        <textarea [(ngModel)]="newApp.description" rows="3" placeholder="Breve descripción de la aplicación..."
          class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all resize-none"></textarea>
      </div>

      <!-- Avatar URL -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">URL del Avatar</label>
        <input type="text" [(ngModel)]="newApp.avatar" placeholder="https://ejemplo.com/logo.png"
          class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all">
      </div>

    </div>

    <!-- Footer modal -->
    <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-100 bg-gray-50">
      <button (click)="closeCreate()"
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 transition-all">
        Cancelar
      </button>
      <button (click)="createApplication()" [disabled]="!newApp.name.trim() || isCreating"
        class="inline-flex items-center gap-2 px-5 py-2 text-sm font-semibold text-white bg-teal-500 hover:bg-teal-600 rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
        <i *ngIf="isCreating" class="fas fa-circle-notch fa-spin"></i>
        <i *ngIf="!isCreating" class="fas fa-plus"></i>
        <span>{{ isCreating ? 'Creando...' : 'Crear' }}</span>
      </button>
    </div>

  </div>
</div>

<!-- ══════════════════════════════════════════════════════════════ -->
<!--  MODAL: EDITAR APLICACIÓN                                     -->
<!-- ══════════════════════════════════════════════════════════════ -->
<div *ngIf="showEditModal"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm px-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-fade-in">

    <!-- Header modal -->
    <div class="flex items-center justify-between px-6 py-5 border-b border-gray-100">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-blue-100 rounded-xl flex items-center justify-center">
          <i class="fas fa-pen text-blue-600 text-sm"></i>
        </div>
        <h2 class="text-lg font-semibold text-slate-900">Editar Aplicación</h2>
      </div>
      <button (click)="closeEdit()" class="text-gray-400 hover:text-gray-600 transition-colors">
        <i class="fas fa-times text-lg"></i>
      </button>
    </div>

    <!-- Body modal -->
    <div class="px-6 py-5 space-y-4">

      <!-- Nombre -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">
          Nombre <span class="text-red-500">*</span>
        </label>
        <input type="text" [(ngModel)]="editApp.name" placeholder="Ej. Sistema de RR.HH."
          class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all">
      </div>

      <!-- Descripción -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Descripción</label>
        <textarea [(ngModel)]="editApp.description" rows="3" placeholder="Breve descripción de la aplicación..."
          class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all resize-none"></textarea>
      </div>

      <!-- Avatar URL -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">URL del Avatar</label>
        <input type="text" [(ngModel)]="editApp.avatar" placeholder="https://ejemplo.com/logo.png"
          class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all">
      </div>

    </div>

    <!-- Footer modal -->
    <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-100 bg-gray-50">
      <button (click)="closeEdit()"
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 transition-all">
        Cancelar
      </button>
      <button (click)="updateApplication()" [disabled]="!editApp.name.trim() || isUpdating"
        class="inline-flex items-center gap-2 px-5 py-2 text-sm font-semibold text-white bg-blue-500 hover:bg-blue-600 rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
        <i *ngIf="isUpdating" class="fas fa-circle-notch fa-spin"></i>
        <i *ngIf="!isUpdating" class="fas fa-save"></i>
        <span>{{ isUpdating ? 'Guardando...' : 'Guardar cambios' }}</span>
      </button>
    </div>

  </div>
</div>
