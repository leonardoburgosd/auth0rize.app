<div class="bg-slate-900 min-h-screen flex items-center justify-center">

  <div *ngIf="!isError; else bloqueFalso" class="text-center">
    <!-- Spinner Principal -->
    <div class="relative mb-8">
      <!-- Círculo exterior -->
      <div class="w-20 h-20 border-4 border-teal-500/30 rounded-full animate-spin-slow"></div>
      <!-- Círculo interior -->
      <div
        class="absolute top-2 left-2 w-16 h-16 border-4 border-t-teal-500 border-r-transparent border-b-transparent border-l-transparent rounded-full animate-spin">
      </div>
      <!-- Punto central -->
      <div
        class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-3 h-3 bg-teal-500 rounded-full animate-pulse-scale">
      </div>
    </div>

    <!-- Texto de Carga -->
    <h2 class="text-2xl font-semibold text-white mb-4 animate-pulse">{{mensaje}}</h2>

    <!-- Puntos animados -->
    <div class="flex justify-center space-x-1 mb-8">
      <div class="w-2 h-2 bg-teal-500 rounded-full animate-bounce-dots"></div>
      <div class="w-2 h-2 bg-teal-500 rounded-full animate-bounce-dots"></div>
      <div class="w-2 h-2 bg-teal-500 rounded-full animate-bounce-dots"></div>
    </div>

    <!-- Barra de progreso opcional -->
    <div class="w-64 bg-slate-700 rounded-full h-2 mb-4">
      <div class="bg-gradient-to-r from-teal-500 to-teal-400 h-2 rounded-full animate-pulse" style="width: 60%"></div>
    </div>

    <!-- Texto secundario -->
    <p class="text-slate-400 text-sm animate-pulse">Por favor espera un momento...</p>
  </div>
  <ng-template #bloqueFalso>
    <div class="text-center max-w-md mx-auto px-6">
      <!-- Icono de Error -->
      <div class="relative mb-8 animate-bounce-in">
        <!-- Círculo de fondo -->
        <div
          class="w-24 h-24 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4 animate-pulse-error">
          <!-- Círculo interior -->
          <div class="w-16 h-16 bg-red-500/30 rounded-full flex items-center justify-center">
            <!-- Icono X -->
            <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </div>
        </div>
      </div>

      <!-- Título de Error -->
      <h2 class="text-3xl font-bold text-white mb-4 animate-fade-in-up">¡Oops!</h2>

      <!-- Mensaje de Error -->
      <h3 class="text-xl font-semibold text-red-400 mb-4 animate-fade-in-up" style="animation-delay: 0.1s;">
        Algo salió mal
      </h3>

      <!-- Descripción del Error -->
      <p class="text-slate-400 mb-8 leading-relaxed animate-fade-in-up" style="animation-delay: 0.2s;">
        {{mensaje}}
      </p>

      <!-- Código de Error (opcional) -->
      <div class="bg-slate-800 border border-slate-700 rounded-lg p-4 mb-8 animate-fade-in-up"
        style="animation-delay: 0.3s;">
        <div class="flex items-center justify-between">
          <span class="text-slate-500 text-sm">Código de error:</span>
          <span class="text-red-400 font-mono text-sm">ERR_500</span>
        </div>
      </div>

      <!-- Botones de Acción -->
      <div class="space-y-4 animate-fade-in-up" style="animation-delay: 0.4s;">
        <!-- Botón Principal -->
        <button (click)="recargar()"
          class="w-full bg-teal-500 hover:bg-teal-600 text-white font-semibold py-3 px-6 rounded-lg transition-all duration-200 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2 focus:ring-offset-slate-900">
          Intentar nuevamente
        </button>

      </div>
    </div>
  </ng-template>
</div>
