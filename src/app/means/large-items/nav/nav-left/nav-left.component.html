<nav class="flex-1 p-4">
  <ul class="space-y-2">
    <li *ngFor="let item of menuItems; let i = index">
      <a *ngIf="sidebarOpen"
      [routerLink]="item.ruta"
        (click)="setActiveMenuItem(i); $event.preventDefault()"
        [class]="'flex items-center p-3 rounded-lg transition-colors group relative ' +
                 (item.active ? 'bg-teal-500 text-white' : 'text-gray-300 hover:bg-slate-800 hover:text-white')"
      >
        <i [class]="item.icon + ' w-5 h-5 flex-shrink-0' "></i>
        <span *ngIf="sidebarOpen" class="ml-3 font-medium">{{ item.label }}</span>

        <!-- Tooltip for collapsed sidebar -->
        <div
          *ngIf="!sidebarOpen"
          class="absolute left-16 bg-slate-800 text-white px-2 py-1 rounded-md text-sm opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50"
        >
          {{ item.label }}
        </div>
      </a>

      <a *ngIf="!sidebarOpen"
      [routerLink]="item.ruta"
        (click)="setActiveMenuItem(i); $event.preventDefault()"
        [class]="'flex items-center p-2 rounded-lg transition-colors group relative ' +
                 (item.active ? 'bg-teal-500 text-white' : 'text-gray-300 hover:bg-slate-800 hover:text-white')"
      >
        <i [class]="item.icon + ' w-5 flex-shrink-0' "></i>
      </a>

    </li>
  </ul>
</nav>
<div class="p-4 border-t border-slate-700">
  <div class="flex items-center cursor-pointer" (click)="onProfileClick()">
    <div class="w-8 h-8 bg-teal-500 rounded-full flex items-center justify-center">
      <i class="fas fa-user w-4 h-4"></i>
    </div>
    <div *ngIf="sidebarOpen" class="ml-3 flex-1">
      <p class="text-sm font-medium">{{userName}}</p>
      <p class="text-xs text-gray-400">{{email}}</p>
    </div>
    <i *ngIf="sidebarOpen" class="fas fa-chevron-down w-4 h-4 text-gray-400"></i>
  </div>
</div>
