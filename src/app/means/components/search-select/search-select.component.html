<div class="relative w-full">
  <div class="relative text-gray-400 focus-within:text-teal-500 transition-colors">
    <!-- Icono de búsqueda -->
    <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 pointer-events-none"></i>
    
    <!-- Input -->
    <input type="text"
           [placeholder]="placeholder"
           [value]="searchTerm"
           (input)="onInput($event)"
           (focus)="onFocus()"
           class="w-full pl-10 pr-10 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all shadow-sm"
           [ngClass]="{'bg-teal-50 border-teal-200': selectedItem}" />
           
    <!-- Botón borrar -->
    <button *ngIf="searchTerm" 
            (click)="clearSelection(true)"
            type="button" 
            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <!-- Dropdown -->
  <div *ngIf="showDropdown" 
       class="absolute z-50 w-full mt-2 bg-white border border-gray-100 rounded-xl shadow-lg max-h-60 overflow-y-auto overflow-x-hidden animate-fade-in">
       
    <!-- Loader -->
    <div *ngIf="isLoading" class="p-4 flex items-center justify-center text-gray-400 gap-2">
      <i class="fas fa-circle-notch fa-spin text-teal-400"></i>
      <span class="text-xs font-medium">Buscando...</span>
    </div>

    <!-- Empty state -->
    <div *ngIf="!isLoading && items.length === 0" class="p-4 text-center text-sm text-gray-500">
      No se encontraron resultados
    </div>

    <!-- Resultados -->
    <ul *ngIf="!isLoading && items.length > 0" class="py-1">
      <li *ngFor="let item of items" 
          (click)="selectItem(item)"
          class="px-4 py-2.5 hover:bg-teal-50 cursor-pointer flex items-center transition-colors">
          
        <!-- Imagen / Avatar (opcional) -->
        <div *ngIf="imageField || getInitial(item)" class="flex-shrink-0 w-8 h-8 rounded-full bg-teal-100 flex items-center justify-center mr-3 hidden sm:flex">
           <img *ngIf="imageField && item[imageField]" [src]="item[imageField]" class="w-full h-full object-cover rounded-full" />
           <span *ngIf="!imageField || !item[imageField]" class="text-xs font-bold text-teal-700">{{ getInitial(item) }}</span>
        </div>
        
        <!-- Textos -->
        <div class="flex flex-col min-w-0">
          <span class="text-sm font-medium text-gray-800 truncate">{{ item[displayField] }}</span>
          <span *ngIf="subtextField && item[subtextField]" class="text-xs text-gray-500 truncate mt-0.5">
            {{ item[subtextField] }}
          </span>
        </div>
      </li>
    </ul>

  </div>
</div>
